<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Rounded black canvas background -->
  <rect width="128" height="128" rx="28" fill="#0a0a0a" />
  
  <!-- Subtle brand hairline border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#faff69" stroke-width="2" stroke-opacity="0.25" />
  
  <!-- Logo symbol g -->
  <g transform="translate(16, 16)">
    <!-- Data Grid dots -->
    <circle cx="20" cy="20" r="3" fill="#faff69" fill-opacity="0.2" />
    <circle cx="76" cy="20" r="3" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="20" cy="76" r="3" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="76" cy="76" r="3" fill="#faff69" fill-opacity="0.2" />
    
    <!-- Data Grid lines -->
    <line x1="20" y1="20" x2="76" y2="20" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="3 3" />
    <line x1="20" y1="20" x2="20" y2="76" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="3 3" />
    <line x1="76" y1="20" x2="76" y2="76" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="3 3" />
    <line x1="20" y1="76" x2="76" y2="76" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="3 3" />
    
    <!-- Stylized "S" path running through nodes in brand electric yellow -->
    <path d="M 72 20 C 50 14, 24 16, 20 28 C 14 44, 48 42, 48 52 C 48 62, 20 60, 24 72 C 28 80, 52 82, 72 76" 
          fill="none" stroke="#faff69" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- SQL 'SELECT' Selector ring / search magnifier in premium white -->
    <circle cx="48" cy="48" r="22" fill="none" stroke="#ffffff" stroke-width="6" />
    
    <!-- Selector pointer / magnifier handle -->
    <line x1="63" y1="63" x2="80" y2="80" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    
    <!-- Active selector dot -->
    <circle cx="48" cy="26" r="4.5" fill="#22c55e" />
  </g>
</svg>